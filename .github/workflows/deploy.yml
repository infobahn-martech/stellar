name: Deploy Stellar

on:
  push:
    branches:
      - development

permissions:
  contents: read

concurrency:
  group: stellar-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code
        run: npm run lint

      - name: Build website
        run: npm run build

      - name: Check exported homepage
        run: node -e "require('node:fs').accessSync('out/index.html')"

      - name: Preview upload
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./out/
          server-dir: ./
          dry-run: false
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.htaccess
            **/.user.ini
            **/.well-known/**